apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-generator
spec:
  template:
    spec:
      containers:
        - name: generator
          env:
            - name: SG_SYMBOL_UPLOAD_TOKEN
              valueFrom:
                secretKeyRef:
                  # The Symbol Upload credential is distinct from a trace token.
                  name: replace-with-symbol-secret
                  key: symbolUploadToken
