apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-generator
spec:
  template:
    spec:
      containers:
        - name: generator
          env:
            - name: SG_CHRONOSPHERE_TENANT
              valueFrom:
                secretKeyRef:
                  # Replace these names with the existing tenant Secret schema.
                  name: replace-with-tenant-secret
                  key: orgName
            - name: SG_CHRONOSPHERE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: replace-with-tenant-secret
                  key: apiToken
