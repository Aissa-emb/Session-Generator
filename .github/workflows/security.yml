name: Security and payload checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --log-opts=--all --redact=100 --no-banner
      - name: Security regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate Android, web, and incident payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 generate.py --profile all --sessions 120 --quiet --dry-run out/android
          python3 tools/check_output.py out/android
          python3 generate.py --profile all --sessions 120 --quiet --platform web --dry-run out/web
          python3 tools/check_output.py out/web
          python3 generate.py --profile all --sessions 120 --quiet --incident payments-db-pool --dry-run out/incident
          python3 tools/check_output.py out/incident
      - name: Validate V2 specs and spec-driven payloads
        shell: bash
        run: |
          set -euo pipefail
          for spec in spec/examples/*.json; do python3 generate.py validate "$spec"; done
          python3 generate.py run spec/examples/baseline-burst.json --dry-run out/spec --quiet --seed 7331
          python3 tools/check_output.py out/spec
          python3 generate.py report out/spec spec/examples/baseline-burst.json
          python3 generate.py lint out/spec
          python3 generate.py run spec/examples/verification-plan.json --dry-run out/verify --quiet
          python3 tools/check_output.py out/verify
          python3 generate.py run spec/examples/web-burst.json --dry-run out/web-spec --quiet --seed 7331
          python3 tools/check_output.py out/web-spec
          python3 generate.py lint out/web-spec
          python3 generate.py run spec/examples/android-web-end-to-end.json --dry-run out/both --quiet --seed 7331
          python3 tools/check_output.py out/both
          python3 generate.py lint out/both
      - name: Server dependencies and generated contract
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r server/requirements.txt
          .venv/bin/python tools/generate_models.py --check
      - name: API, job and receiver integration tests
        run: .venv/bin/python -m unittest discover -s tests/server -v
      - name: UI contract, build and dependency audit
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/web run schema:check
          npm --prefix apps/web run build
          npm --prefix apps/web audit --audit-level=high
      - name: Browser acceptance
        run: |
          cd apps/web
          npx playwright install --with-deps chromium
          npm test
      - name: Static security analysis
        run: .venv/bin/bandit --ini .bandit -r xcorgen generate.py tools server

      - name: Non-root isolated container acceptance
        run: |
          docker build -t session-generator:ci .
          docker run -d --name session-generator-check --network none --read-only --tmpfs /tmp:rw,nosuid,size=256m --tmpfs /var/lib/session-generator:rw,uid=10001,gid=10001,mode=700,size=512m --cap-drop ALL --security-opt no-new-privileges session-generator:ci
          trap 'docker rm -f session-generator-check' EXIT
          for attempt in {1..30}; do
            if docker exec session-generator-check python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"; then break; fi
            sleep 1
          done
          docker exec session-generator-check python -m tools.container_smoke
